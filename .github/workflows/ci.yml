# CI Pipeline — Security Gates + Build
# Feature F-01-002: CI/CD Pipeline with Security Gates
#
# Runs on every pull request. All security gates MUST pass before
# any Docker image is built. No secrets are hardcoded in this file —
# all credentials are injected via GitHub Actions Secrets at runtime.
#
# Stage order (enforced):
#   1. lint           — flake8 / ruff static analysis
#   2. pip-audit      — dependency vulnerability scan (HIGH/CRITICAL fail)
#   3. bandit         — SAST for Python (HIGH-severity fail)
#   4. gitleaks       — secret scanning on commit diff
#   5. test           — pytest unit/integration suite
#   6. docker-build   — build image only after all gates pass
#   7. trivy          — container vulnerability scan (CRITICAL fail)
#   8. ecr-push       — push to ECR (staging PRs only)

name: CI — Security Gates

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Gate 1: Lint
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8 / ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff flake8

      - name: Run ruff
        run: ruff check . --select E,F,W --ignore E501

      - name: Run flake8
        run: flake8 . --max-line-length=120 --exclude=.venv,venv,__pycache__,.git,infra

  # ─────────────────────────────────────────────────────────────
  # Gate 2: Dependency vulnerability scan (pip-audit)
  # ─────────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit — Dependency CVE Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Run pip-audit (fail on HIGH or CRITICAL CVE)
        # pip-audit exits non-zero if any vulnerability is found.
        # The --severity flag ensures HIGH and CRITICAL trigger failure.
        run: pip-audit --requirement requirements.txt --severity HIGH

  # ─────────────────────────────────────────────────────────────
  # Gate 3: SAST — Bandit
  # ─────────────────────────────────────────────────────────────
  bandit:
    name: Bandit — SAST Python
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (fail on HIGH severity)
        # -l HIGH ensures only HIGH or CRITICAL findings fail the build.
        # -r scans recursively. Excludes test directories and third-party code.
        run: |
          bandit -r . \
            -l \
            --severity-level HIGH \
            --exclude ./.venv,./venv,./.git,./infra,./tests,./validation \
            -f json \
            -o bandit-report.json || \
          (cat bandit-report.json && exit 1)

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Gate 4: Secret scanning — Gitleaks
  # ─────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks — Secret Scanning
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────────────────────
  # Gate 5: Unit/integration tests (pytest)
  # ─────────────────────────────────────────────────────────────
  test:
    name: pytest — Test Suite
    runs-on: ubuntu-latest
    needs: [pip-audit, bandit, gitleaks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml
        env:
          # No real secrets injected here — tests use in-memory/mock backends
          ENVIRONMENT: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Gate 6: Docker build (only after all security gates pass)
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag (commit SHA)
        id: meta
        run: echo "sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            protegopay/app:${{ github.sha }}
            protegopay/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Gate 7: Container vulnerability scan — Trivy
  # ─────────────────────────────────────────────────────────────
  trivy:
    name: Trivy — Container Image Scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "protegopay/app:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: "os,library"
          # Fail only on CRITICAL vulnerabilities per acceptance criteria
          severity: "CRITICAL"
          output: trivy-report.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Gate 8: Push to ECR (staging target only, after Trivy passes)
  # ─────────────────────────────────────────────────────────────
  ecr-push-staging:
    name: Push to ECR (staging)
    runs-on: ubuntu-latest
    needs: trivy
    # Only push to ECR when targeting the develop (staging) branch
    if: github.base_ref == 'develop' || github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Configure AWS credentials (from GitHub Secrets — never hardcoded)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR (staging)
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag protegopay/app:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker tag protegopay/app:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:staging-latest
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:staging-latest
