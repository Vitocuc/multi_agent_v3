[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protego-events"
version = "0.1.0"
description = "Protego Life Simulator — behavioral event ingestion microservice"
# Relaxed to >=3.11 for CI compatibility; production target remains Python 3.12
requires-python = ">=3.11"
dependencies = [
    # FastAPI — upgraded from 0.111 to 0.115+ for security patches in starlette
    # (starlette >=1.0.1 fixes multiple CVEs: GHSA-f96h-pmfr-66vw, GHSA-x746-7m8f-x49c, etc.)
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]==0.30.1",
    # Pydantic v2 — kept compatible with fastapi>=0.115
    "pydantic>=2.8.2,<3.0.0",
    "pydantic-settings>=2.3.4,<3.0.0",
    "asyncpg==0.29.0",
    # PyJWT replaces python-jose (which has unpatched CVEs: PYSEC-2025-185, PYSEC-2024-232/233)
    "PyJWT[crypto]>=2.8.0",
    # python-multipart — upgraded from 0.0.9 to fix DoS CVEs (GHSA-59g5-xgcq-4qw3, etc.)
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    # pytest>=9.0.3 fixes CVE-2025-71176
    "pytest>=9.0.3",
    # pytest-asyncio>=0.26 supports pytest>=9
    "pytest-asyncio>=0.26.0",
    "httpx==0.27.0",
    "pip-audit>=2.7.3",
    "ruff==0.5.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["."]
